# Brew Assistant configuration.
# The Ollama model name lives ONLY here — never hardcode it in business logic.
model: qwen2.5:7b
models:                                # chat candidates for the sidebar dropdown
  qwen2.5:7b:   { num_ctx: 8192 }      # per-model overrides; mere presence of a key marks it as a candidate
  gemma4:12b:   {}                     # add more pulled models here; `model:` stays the startup default
  qwen3.5:9b:   {}
  mistral:7b:   {}                     # example override: { temperature: 0.2 }
temperature: 0.3
top_k: 6                             # Phase 2: raised 4 -> 6 (store grows 5x+)
num_ctx: 8192                        # Ollama context window: 6 x 2600-char chunks fit with history headroom
data_dir: data                        # legacy single-dir key (tests/older scripts)
data_dirs:                            # ingest reads fixtures + collected data
  - data                              # repo fixtures (+ self-authored CSV tables) — chat works without collectors
  - collected_data                    # gitignored collector output; skipped with a warning if absent
collect_dest: collected_data          # collectors write here (default for dev; point anywhere, e.g. \\myshare\brew)
collectors:                           # enabled data collectors (python -m collectors)
  - diydog
  - bjcp
  - ba
  - whitelabs
  - wyeast
  - brewingtools
  - hop_substitutions
chroma_dir: chroma_db
embedding_model: all-MiniLM-L6-v2
